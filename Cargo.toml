[package]
name = "market-data-link"
version = "0.1.0"
edition = "2024"
license = "proprietary"

[features]
default = ["aeron"]
aeron = ["dep:rusteron-client"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"
rusteron-client = { version = "=0.1.160", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tracing = "0.1"
tungstenite = "0.29"
